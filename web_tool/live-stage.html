<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OLV Live Stage</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #00ff00;
      }
      body {
        display: grid;
        place-items: center;
      }
      .stage {
        width: min(72vmin, 720px);
        height: min(72vmin, 720px);
        display: grid;
        place-items: center;
        animation: float 4s ease-in-out infinite;
        filter: drop-shadow(0 18px 18px rgba(0, 0, 0, 0.22));
      }
      .stage img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-14px) rotate(1deg);
        }
      }
      .hint {
        position: fixed;
        left: 24px;
        bottom: 20px;
        padding: 10px 14px;
        border-radius: 10px;
        background: rgba(8, 20, 60, 0.82);
        color: #fff;
        font: 14px/1.5 "Microsoft YaHei", sans-serif;
        opacity: 1;
        transition: opacity 0.4s;
      }
      .hint.hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .stage {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img src="/avatars/deepseek_dafeiyu_placeholder.svg" alt="OLV live stage placeholder" />
    </div>
    <div class="hint" id="hint">
      直播舞台占位页 · 绿色背景可做色度键 · 点击隐藏提示
    </div>
    <script>
      const hint = document.getElementById("hint");
      hint.addEventListener("click", () => hint.classList.add("hidden"));
      setTimeout(() => hint.classList.add("hidden"), 5000);
    </script>
  </body>
</html>
